<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Call tree: a root function calling into two, then leaves. Single-color
       so the VS Code activity bar can theme it (currentColor). -->
  <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
    <path d="M12 5.5 L7 11"/>
    <path d="M12 5.5 L17 11"/>
    <path d="M7 11 L4.5 17"/>
    <path d="M7 11 L9.5 17"/>
    <path d="M17 11 L19.5 17"/>
  </g>
  <g fill="currentColor">
    <circle cx="12"  cy="4.5"  r="2.4"/>
    <circle cx="7"   cy="11"   r="2.1"/>
    <circle cx="17"  cy="11"   r="2.1"/>
    <circle cx="4.5" cy="18"   r="1.8"/>
    <circle cx="9.5" cy="18"   r="1.8"/>
    <circle cx="19.5" cy="18"  r="1.8"/>
  </g>
</svg>
